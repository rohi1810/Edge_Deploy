# Static serving for the demo.
#
# nginx rather than `python -m http.server` for one concrete reason: http.server
# does not implement HTTP Range. Without Range, seeking inside the sim2real
# video does not work -- the browser has to refetch from byte 0, so dragging the
# scrubber either stalls or snaps back. That is a bad thing to discover during a
# defense. nginx serves Range on static files by default.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The payloads are JS wrappers around JSON (see build_demo.write_payload for
    # why they cannot be .json), and the largest are several MB of base64
    # geometry. Compressing them is the difference between an instant tunnel
    # section and a visible wait.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    # No png/jpeg/mp4/woff2 here on purpose: all four are already compressed, and
    # listing them would spend CPU to add bytes. Leaving them out of gzip_types is
    # the whole mechanism -- no per-extension location block is needed to "turn
    # gzip off" for them, because it was never on.
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml;

    # Fonts and the vendored three.js build are the only things here that are
    # genuinely immutable -- they change only when their filename does.
    # ^~ rather than a regex: a regex location would also outrank the
    # /payloads/ block below and silently strip its cache headers.
    #
    # Note on the repeated nosniff line below: nginx's add_header does NOT merge
    # with the parent scope -- a location that sets any add_header inherits none
    # of the server-level ones. So every block that sets Cache-Control has to
    # restate the security header, or silently lose it.
    location ^~ /assets/fonts/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /assets/vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Everything under payloads/ is regenerated in place by build_demo.py, keeping
    # the same filenames: frames/0042.png is a different image after a rebuild, and
    # metrics.js holds different numbers. Caching any of it by name serves stale
    # content after a rebuild with no way for the viewer to tell.
    #
    # This was observed, not theorised: with a plain static server and no cache
    # headers, the page went on rendering "transcribed, not regenerated" from a
    # cached metrics.js while the server was already serving the measured one.
    # must-revalidate keeps the bytes in the browser cache but forces a
    # conditional request, so unchanged files still come back as a cheap 304.
    location ^~ /payloads/ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Nothing here is user-generated, but the page is meant to be handed around
    # as a thesis artifact -- these cost nothing and prevent it being framed.
    add_header X-Content-Type-Options nosniff  always;
    add_header X-Frame-Options        SAMEORIGIN always;
}
